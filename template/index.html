<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <main class="container">
        <p class="eyebrow">Market research workspace</p>
        <h1>Stock Market Predictor</h1>
        <p class="lede">Explore recent price movement and a transparent short-term trend baseline.</p>
        <form id="stockForm">
            <div class="form-group">
                <label for="stockSymbol">Stock Symbol:</label>
                <input type="text" id="stockSymbol" name="stockSymbol" required 
                       placeholder="Enter stock symbol (e.g., AAPL)">
            </div>
            <div class="form-group">
                <label for="startDate">Start Date:</label>
                <input type="date" id="startDate" name="startDate" required>
            </div>
            <div class="form-group">
                <label for="endDate">End Date:</label>
                <input type="date" id="endDate" name="endDate" required>
            </div>
            <div class="form-group">
                <label for="forecastDays">Forecast horizon (trading days)</label>
                <input type="number" id="forecastDays" min="1" max="30" value="5" required>
            </div>
            <button type="submit">Analyze stock</button>
        </form>
        <div id="result" style="margin-top: 20px;"></div>
    </main>
    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
